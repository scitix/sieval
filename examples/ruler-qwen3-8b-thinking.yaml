# ==============================================================================
# RULER Long-Context Evaluation — Qwen3-8B, Thinking Enabled
# ==============================================================================
# Scenario: RULER across a 4K–128K context sweep with Qwen3 internal thinking
#   enabled. Six tasks (one per length) served by two configs (native / YaRN).
# Task: RULER (0-shot, generative + thinking).
#
# Configuration highlights:
#   - enable_thinking: true; thinking_budget: 8192 (Qwen3ThinkingBudgetLogitProcessor)
#   - Datasets: ruler_4k / 8k / 16k / 32k / 64k / 128k (subtask: all, 500 samples each)
#   - Models:
#       qwen3-8b-think       — native 32768 context, serves 4K / 8K
#       qwen3-8b-think-yarn  — YaRN-scaled to 131072, serves 16K / 32K / 64K / 128K
#     (16K/32K fit the native window but run under YaRN to match the Qwen3
#      technical report's RULER setup; see the note above `tasks:`)
#   - Temperature / top_p / top_k: 0.6 / 0.95 / 20 ; concurrency_limit: 32
#   - GPU: H200-141G (both configs)
#
# Setup steps:
#   1. Prepare data: sieval dataset download ruler
#      (enable_thinking and think_budget are baked into each dataset's args below)
#   2. Point checkpoints / tokenizers at your local model (fields marked # EDIT ME)
#   3. Run evaluation: sieval run ruler-qwen3-8b-thinking.yaml
#
# Editable fields (marked # EDIT ME inline):
#   models.*.infer.checkpoint            — local model path
#   datasets.ruler_*.args.tokenizer_path — tokenizer path (same as model)
#   custom_logit_processor is framework-generated; do not edit by hand
#
# Output:
#   result_dir: ./outputs/ruler_qwen3_8b_thinking
#   Per-cell scores plus per-length and overall RULER means (see report()).
#
# Note: thinking requires reasoning_parser: qwen3 and enable_custom_logit_processor: true.
#
# Budget coupling (keep these in sync when editing):
#   Each dataset sets think_budget: 8192 to match the serving thinking_budget: 8192.
#   For contexts < 128K the think budget is NOT reserved while packing the prompt
#   (it is added back at inference), so the prompt fills max_seq_length reserving
#   only the answer; it still fits because the serving context_length leaves
#   headroom — input (≤ max_seq_length) + 8192 think + answer. For 128K the think
#   budget IS reserved while packing (max_seq_length == context_length == 131072),
#   so no headroom is needed. If you change a dataset's max_seq_length or a model's
#   context_length, re-check: max_seq_length + think_budget + answer ≤ context_length.
# ==============================================================================

result_dir: ./outputs/ruler_qwen3_8b_thinking
models:
  qwen3-8b-think:
    args:
      concurrency_limit: 32
      temperature: 0.6
      top_p: 0.95
      extra_body:
        enable_thinking: true
        top_k: 20
        custom_logit_processor: '{"callable": "80049554000000000000008c2a73676c616e672e7372742e73616d706c696e672e637573746f6d5f6c6f6769745f70726f636573736f72948c215177656e335468696e6b696e674275646765744c6f67697450726f636573736f729493942e"}'
        custom_params:
          thinking_budget: 8192
    infer:
      backend: sglang
      recipe: qwen3-8b
      checkpoint: /path/to/qwen3-8b   # EDIT ME
      overrides:
        context_length: 32768
        reasoning_parser: qwen3
        enable_custom_logit_processor: true
    infer_meta:
      gpu: H200-141G
      image: lmsysorg/sglang:latest

  qwen3-8b-think-yarn:
    args:
      concurrency_limit: 32
      temperature: 0.6
      top_p: 0.95
      extra_body:
        enable_thinking: true
        top_k: 20
        custom_logit_processor: '{"callable": "80049554000000000000008c2a73676c616e672e7372742e73616d706c696e672e637573746f6d5f6c6f6769745f70726f636573736f72948c215177656e335468696e6b696e674275646765744c6f67697450726f636573736f729493942e"}'
        custom_params:
          thinking_budget: 8192
    infer:
      backend: sglang
      recipe: qwen3-8b
      checkpoint: /path/to/qwen3-8b   # EDIT ME
      overrides: { context_length: 131072, reasoning_parser: qwen3, enable_custom_logit_processor: true, json_model_override_args: "{\"rope_scaling\": {\"rope_type\": \"yarn\", \"factor\": 4, \"original_max_position_embeddings\": 32768}}" }
    infer_meta:
      gpu: H200-141G
      image: lmsysorg/sglang:latest

datasets:
  ruler_4k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 4096
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

  ruler_8k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 8192
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

  ruler_16k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 16384
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

  ruler_32k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 32768
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

  ruler_64k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 65536
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

  ruler_128k:
    class: RulerDataset
    path: ${SIEVAL_DATA_DIR}
    args:
      subtask: all
      max_seq_length: 131072
      num_samples: 500
      tokenizer_type: hf
      tokenizer_path: /path/to/qwen3-8b   # EDIT ME
      enable_thinking: true
      model_name: qwen3
      think_budget: 8192

# Model assignment by context length:
#   - 4K/8K  → qwen3-8b-think (native 32768 context, no YaRN)
#   - 16K+   → qwen3-8b-think-yarn (YaRN-scaled to 131072)
# 16K/32K fit the native window, so YaRN is not strictly required there; they are
# evaluated under YaRN anyway to match the RULER setup in the Qwen3 technical
# report (Qwen3 enables YaRN for long-context eval), so these numbers line up with
# that table. 64K/128K exceed the native window and require YaRN.
tasks:
  ruler_4k:
    class: RulerZeroShotGenTask
    dataset: ruler_4k
    model: qwen3-8b-think

  ruler_8k:
    class: RulerZeroShotGenTask
    dataset: ruler_8k
    model: qwen3-8b-think

  ruler_16k:
    class: RulerZeroShotGenTask
    dataset: ruler_16k
    model: qwen3-8b-think-yarn

  ruler_32k:
    class: RulerZeroShotGenTask
    dataset: ruler_32k
    model: qwen3-8b-think-yarn

  ruler_64k:
    class: RulerZeroShotGenTask
    dataset: ruler_64k
    model: qwen3-8b-think-yarn

  ruler_128k:
    class: RulerZeroShotGenTask
    dataset: ruler_128k
    model: qwen3-8b-think-yarn
