# ------------------------------------------------------------------------------
# Spider 2.0-lite — the SQLite subset (the default)
# ------------------------------------------------------------------------------
# The 135 `local` questions are the ones that run with no cloud credentials, and
# the dataset selects them by default, so this config names no subset at all.
#
#   1. sieval dataset download spider2_lite
#   2. export OPENAI_API_KEY=... OPENAI_BASE_URL=...
#   3. sieval eval examples/spider2-lite-local.yaml
#
# `score` here is over the 135 questions requested — NOT upstream's
# `correct/547`. The report writes `engines: sqlite` so the two cannot be
# confused. To run the whole benchmark instead, ask for every engine:
#
#   datasets:
#     spider2_lite:
#       args:
#         engines: [sqlite, bigquery, snowflake]
#
# which needs GOOGLE_APPLICATION_CREDENTIALS (or `gcloud auth
# application-default login`) and the three SNOWFLAKE_* variables; without them
# those 412 questions are inferred and then scored `missing_credentials`, which
# is ~43x the prompt spend of this config for no verdict.
#
# n=1 and temperature 0 are upstream's protocol: one deterministic pass each.
# ------------------------------------------------------------------------------
result_dir: ./outputs/spider2-lite-local

models:
  gateway:
    model: gpt-5.3-codex                    # EDIT ME
    api_base: https://your-endpoint/v1      # EDIT ME (or set OPENAI_BASE_URL)
    args:
      concurrency_limit: 8
      temperature: 0.0
      max_tokens: 4096

datasets:
  spider2_lite:
    class: Spider2LiteDataset
    path: ${SIEVAL_DATA_DIR}/spider2_lite

tasks:
  spider2_lite_local:
    class: Spider2LiteZeroShotGenTask
    dataset: spider2_lite
    model: gateway
    args:
      n: 1
