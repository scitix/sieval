name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"
  # light, no torch. `iheval` is a superset of `ifeval` plus rouge-score, so it
  # adds ~one wheel and keeps the reimplemented IHEval graders under test.
  # `ifbench` earns its place the same way: emoji + syllapy on top of the nltk
  # `ifeval` already pulls, and the repaired IFBench checkers are first-party
  # code, untestable without the vendored fork they subclass. Its NLTK corpora
  # are still fetched on demand by the vendored code at import time, exactly as
  # `multi_if` and the `ruler` dataset do in this job -- no staged copy of the
  # corpus list lives here to drift from them. That fetch is not concurrency
  # safe, though, so the parallel test step is preceded by one serial warm-up
  # import; see the step below for why.
  INSTALL_GROUPS: >-
    -G drop -G ifbench -G ifeval -G iheval -G math -G scicode -G test -G dev

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'sieval/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'pdm.lock'
            tests:
              - 'tests/**'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate conventional commit messages in PR range
        run: |
          set -euo pipefail
          pat='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          fail=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            if ! echo "$msg" | grep -qE "$pat"; then
              echo "::error::non-conventional commit $sha: $msg"
              fail=1
            fi
          done < <(git rev-list --no-merges \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit $fail

  typecheck:
    needs: changes
    # `[tool.ty.environment] root = ["./"]` — ty checks tests/ too, so a
    # test-only change can break it. Keep the trigger as wide as the tool.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: true
      - run: pdm install --check --frozen-lockfile ${{ env.INSTALL_GROUPS }}
      - run: pdm run ty check

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Preflight's lock-drift check needs the merge base with main to know
          # which versions this branch moved; a shallow clone would skip it.
          fetch-depth: 0
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true
      - name: Install (base + light groups; no torch)
        run: pdm install --check --frozen-lockfile ${{ env.INSTALL_GROUPS }}
      - name: Preflight (registration, version, deps, links, meta-drift)
        run: pdm run python scripts/check_preflight.py
      # `sieval/community/ifbench/instructions_util.py` calls
      # `download_nltk_resources()` at module scope, so the corpora are fetched
      # by whoever imports the vendored fork first. Serial that was fine. Under
      # `-n auto` several workers collect `test__ifbench_fixed_checkers.py` at
      # the same moment and race to unzip into one shared NLTK_DATA: the losers
      # read a half-written archive and die with FileExistsError / EOFError /
      # LookupError -- none of them the LookupError that helper catches -- and
      # a collection error takes the whole run with it. Reproduced outside CI:
      # 4 concurrent cold imports, 3 fail; warmed first, 4 pass.
      #
      # This imports the module the tests do, in the same job and environment,
      # so it populates whichever directory the code resolves to rather than a
      # guess -- and it asks for exactly the corpora the code asks for, so
      # there is no second copy of the list here to drift from it.
      - name: Warm the NLTK corpora the vendored IFBench graders fetch on import
        run: pdm run python -c "import sieval.community.ifbench.instructions"
      # `benchmark` deselected: shared runners cannot hold wall-clock
      # thresholds calibrated on a dedicated box. The rest is deterministic.
      #
      # `-n auto` is one worker per vCPU, and one per vCPU is the ceiling that
      # matters: the math tasks grade under a 30s in-code timeout, and enough
      # oversubscription starves that call until it trips and scores the sample
      # wrong -- ~16 green tests turn red together at 32x, with no assertion on
      # time anywhere in them. `auto` reads `os.cpu_count()`, which is the real
      # vCPU count on a GitHub-hosted VM (this job runs no `container:`), so it
      # lands at 1:1. Pinning a literal here would only drift from the runner.
      - name: Unit + integration + acceptance tests + coverage
        run: >-
          pdm run python -m pytest tests/unit tests/integration tests/acceptance
          -m "not stress and not benchmark"
          -n auto --cov --cov-report=xml -q
      - name: Upload coverage (advisory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitization scan
        run: ./scripts/sanitize.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GL=8.21.2
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  check:
    if: always()
    needs: [changes, pre-commit, commit-lint, typecheck, checks, sanitize, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: commit-lint, typecheck, checks
          jobs: ${{ toJSON(needs) }}
