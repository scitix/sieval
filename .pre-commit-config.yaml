# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
# sieval/community/ and vendor/ hold vendored third-party code kept
# byte-identical to upstream — do not let hooks reformat them.
exclude: ^(sieval/community/|vendor/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # No longer bundling RULER corpus (moved to local: bring-your-own model).
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # --no-schema: taplo 0.9.3 cannot deserialize the current
        # schemastore.org catalog (https://www.schemastore.org/api/json/catalog.json)
        # since schemastore's catalog format evolved past taplo's
        # SchemaCatalog enum. Newer taplo (0.10.0) is fixed upstream but
        # not yet on PyPI / taplo-pre-commit. Skip schema validation
        # until the wrapper catches up; taplo-format still enforces syntax.
        args: [--no-schema]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
  - repo: local
    hooks:
      - id: layer-imports
        name: check layer + sub-package boundary, private-access, relative-import scope
        entry: python scripts/check_layer_imports.py
        language: python
        types: [python]
        files: ^(sieval|scripts)/
      - id: lock-drift
        name: check pdm.lock for unrequested version drift
        entry: python scripts/check_preflight.py --check check_deps
        language: python
        # Runs the whole check_deps group, which at quick level is pure file
        # reads plus PEP 440 comparison — no sieval import. Anything added to
        # that group must stay import-light or this isolated env breaks.
        additional_dependencies: ["packaging>=21.0"]
        files: ^(pdm\.lock|pyproject\.toml)$
        pass_filenames: false

ci:
  autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
  autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
